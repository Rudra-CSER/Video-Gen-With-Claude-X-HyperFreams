<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Golden scene — kit check</title>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/js/kit.js"></script>
<link rel="stylesheet" href="assets/css/kit.css" />
<style>
  body { margin: 0; background: #0C1233; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-ui); }
  #gold-bg { position: absolute; inset: 0;
    background:
      radial-gradient(900px 620px at 78% 42%, rgba(46, 91, 238, .38), rgba(46, 91, 238, 0) 70%),
      radial-gradient(700px 520px at 12% 88%, rgba(236, 90, 42, .14), rgba(236, 90, 42, 0) 70%),
      linear-gradient(140deg, #0C1233 0%, #151E4D 55%, #1B2766 100%); }
  .rig { position: absolute; inset: 0; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="golden" data-start="0" data-width="1920" data-height="1080" data-duration="9">
  <div id="gold-bg"></div>
  <div id="gold-scene" class="clip" data-start="0" data-duration="9">
    <div class="rig" id="gold-rig">
      <div class="phone" id="gold-phone">
        <div class="side-btn" style="top:190px;height:70px"></div>
        <div class="side-btn" style="top:290px;height:120px"></div>
        <div class="glass"><div class="screen" id="gold-screen"></div></div>
      </div>
    </div>
    <div class="col-left">
      <div class="kicker" id="gold-kicker">Step 6 · Cart &amp; checkout</div>
      <h2 class="headline" id="gold-head">See every rupee <span class="accent">before</span> you order.</h2>
      <p class="subline" id="gold-sub">Item total, the stall's own delivery charge, and exactly what you pay the stall.</p>
    </div>
    <div class="callout" id="gold-call1"><span class="dot"></span>Set by the stall · shown up front</div>
    <div class="callout callout--dark" id="gold-call2"><span class="dot"></span>SETU does not collect this</div>
    <div class="cap cap--left" id="gold-cap1"><span class="cap-in">Check the total before you place it.</span></div>
  </div>
</div>
<script>
  const K = window.SetuKit;
  const spec = { left: 1150, top: 70, k: 1.08 };
  K.placePhone(document.getElementById('gold-phone'), spec);
  const screen = document.getElementById('gold-screen');
  const cart = K.layer(screen, 'assets/ui/cart/01-cart.png', 'gold-cart', { visible: true });
  const conf = K.layer(screen, 'assets/ui/checkout/01-confirm-cash.png', 'gold-conf');
  const M = {
    fee: { x: 18, y: 509, w: 354, h: 46 },        // whole "Seller delivery charge" row
    payable: { x: 18, y: 596, w: 354, h: 46 },
    review: { x: 143.8, y: 782, w: 228.2, h: 48 },
    amountCard: { x: 18, y: 66, w: 354, h: 150 },
    cash: { x: 18, y: 260, w: 354, h: 70 },
  };

  const tl = gsap.timeline({ paused: true });
  // phone enters
  tl.fromTo('#gold-phone', { y: 80, opacity: 0, rotate: 2 }, { y: 0, opacity: 1, rotate: 0, duration: 1.1, ease: 'expo.out' }, 0);
  // copy
  K.fadeUp(tl, '#gold-kicker', 0.25);
  K.revealWords(tl, document.getElementById('gold-head'), 0.35);
  K.fadeUp(tl, '#gold-sub', 0.9);
  K.fadeUp(tl, '#gold-cap1', 0.6, { y: 16, dur: 0.5 });
  // highlight the charges on the real cart
  K.ring(tl, screen, M.fee, 1.5, 1.6);
  const feeC = K.toCanvas(spec, M.fee.x, M.fee.y + M.fee.h / 2);
  gsap.set('#gold-call1', { left: feeC.x - 520, top: feeC.y - 30 });
  K.callout(tl, '#gold-call1', 1.6, 1.6);
  K.ring(tl, screen, M.payable, 3.1, 1.0, { blue: true });
  // tap "Review order" -> checkout pushes in
  K.tap(tl, screen, M.review, 4.0);
  K.swapPush(tl, cart, conf, 4.35);
  // camera pushes onto the amount card
  const P = K.toCanvas(spec, 195, 140);
  K.focus(tl, '#gold-rig', P, 1.65, 5.2, 1.1, { to: { x: 1390, y: 380 } });
  gsap.set('#gold-call2', { left: 860, top: 330 });
  K.callout(tl, '#gold-call2', 5.9, 1.9);
  K.unfocus(tl, '#gold-rig', 7.4, 0.9);
  K.ring(tl, screen, M.cash, 8.0, 0.8);
  window.__timelines['golden'] = tl;
</script>
</body>
</html>
