<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template id="s06-your-picks-template">
  <link rel="stylesheet" href="assets/css/kit.css" />
  <style>
    #root { position: absolute; inset: 0; }
    #root .rig { position: absolute; inset: 0; transform-origin: 0 0; }
    #s06-kicker { position: absolute; left: 140px; top: 200px; opacity: 0; }

    /* Capture layers that enter later start hidden (GSAP owns their opacity from then on). */
    .s06-off { opacity: 0; }

    /* Step 3 'picked' layer: union of three circles, one per tapped chip (radii tweened by the timeline). */
    #s06-l31 {
      --s06-r1: 0px; --s06-r2: 0px; --s06-r3: 0px;
      -webkit-mask-image:
        radial-gradient(circle var(--s06-r1) at 148.4px 584.7px, #000 calc(100% - .75px), transparent 100%),
        radial-gradient(circle var(--s06-r2) at 259px 585px, #000 calc(100% - .75px), transparent 100%),
        radial-gradient(circle var(--s06-r3) at 128.5px 413px, #000 calc(100% - .75px), transparent 100%);
      mask-image:
        radial-gradient(circle var(--s06-r1) at 148.4px 584.7px, #000 calc(100% - .75px), transparent 100%),
        radial-gradient(circle var(--s06-r2) at 259px 585px, #000 calc(100% - .75px), transparent 100%),
        radial-gradient(circle var(--s06-r3) at 128.5px 413px, #000 calc(100% - .75px), transparent 100%);
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    }

    /* Focus mask over Step 4 (screen px): dims everything but the three card titles. */
    #s06-mask { position: absolute; left: 0; top: 0; width: 390px; height: 844px; opacity: 0; pointer-events: none; overflow: visible; }
    /* 'Start ordering' commit wipe (clip-path circle grows from the button). */
    #s06-wipe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: #0033DA; opacity: 0; pointer-events: none; }
    /* Title rings: the kit ring with a slimmer halo, so it stays off the dimmed sub-lines 2 px below. */
    .ring.s06-tring { box-shadow: 0 0 0 2px rgba(236, 90, 42, .16), 0 0 14px rgba(236, 90, 42, .34); }

    /* Kinetic list (canvas level, text column x 140-820). */
    .s06-line {
      position: absolute; left: 140px; height: 44px;
      display: flex; align-items: center; gap: 18px;
      font: 700 40px/1 var(--font-display); letter-spacing: -.01em; color: #fff;
      white-space: nowrap; opacity: 0;
    }
    .s06-line svg {
      width: 34px; height: 34px; flex: none; display: block;
      fill: none; stroke: #B8C7FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    #s06-li1 { top: 330px; }
    #s06-li2 { top: 400px; }
    #s06-li3 { top: 470px; }
  </style>
  <div id="root" data-composition-id="s06-your-picks" data-width="1920" data-height="1080">
    <div class="rig" id="s06-rig">
      <div class="phone" id="s06-phone">
        <div class="side-btn" style="top:190px;height:70px"></div>
        <div class="side-btn" style="top:290px;height:120px"></div>
        <div class="glass"><div class="screen" id="s06-screen">
          <div class="layer" id="s06-l23"><img src="assets/ui/onboarding/23-step2-done.png" alt="" /></div>
          <div class="layer s06-off" id="s06-l30"><img src="assets/ui/onboarding/30-step3.png" alt="" /></div>
          <!-- 30 and 31 differ only in the three tapped chips: ONE 'picked' layer, revealed chip by chip
               through a three-circle mask (one img, so the capture is discovered once). -->
          <div class="layer s06-off" id="s06-l31"><img src="assets/ui/onboarding/31-step3-picked.png" alt="" /></div>
          <div class="layer s06-off" id="s06-l40"><img src="assets/ui/onboarding/40-step4.png" alt="" /></div>
          <div class="layer s06-off" id="s06-l41"><img src="assets/ui/onboarding/41-step4-ack.png" alt="" /></div>
          <svg id="s06-mask" viewBox="0 0 390 844" aria-hidden="true">
            <defs>
              <filter id="s06-feather"><feGaussianBlur stdDeviation="2" /></filter>
              <mask id="s06-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="390" height="844">
                <rect x="0" y="0" width="390" height="844" fill="#fff" />
                <g fill="#000" filter="url(#s06-feather)">
                  <rect x="77.2" y="267.7" width="202.6" height="24.3" rx="10.5" />
                  <rect x="77.2" y="382.7" width="153" height="24.3" rx="10.5" />
                  <rect x="77.2" y="480.7" width="190.6" height="24.3" rx="10.5" />
                </g>
              </mask>
            </defs>
            <rect x="0" y="0" width="390" height="844" fill="rgb(8, 12, 32)" fill-opacity="0.55" mask="url(#s06-holes)" />
          </svg>
          <div class="layer s06-off" id="s06-lhome"><img src="assets/ui/home/01-first-home.png" alt="" /></div>
          <div id="s06-wipe"></div>
        </div></div>
      </div>
    </div>

    <div class="kicker" id="s06-kicker">04 · Your picks</div>

    <!-- The app's own Step 4 icons (client/src/ui/Icon.jsx: wallet, bike, shieldCheck; Lucide-style, 24 viewBox). -->
    <div class="s06-line" id="s06-li1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18v3" /><rect x="3" y="7.5" width="18" height="12" rx="2.5" /><path d="M16 13h2.5" /></svg><span>SETU never takes your money</span></div>
    <div class="s06-line" id="s06-li2"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="3.2" /><circle cx="18" cy="17" r="3.2" /><path d="M6 17 10 8h4l2 9" /><path d="M12 8h4l1-3h2" /></svg><span>SETU does not deliver</span></div>
    <div class="s06-line" id="s06-li3"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 5 5v6c0 4.4 2.9 7.9 7 9 4.1-1.1 7-4.6 7-9V5z" /><path d="m9 12 2 2 4-4" /></svg><span>SETU approves and records</span></div>
  </div>
  <script>
    (function () {
      const K = window.SetuKit;
      const spec = { left: 1150, top: 70, k: 1.08 };
      K.placePhone(document.getElementById('s06-phone'), spec);
      const $ = (id) => document.getElementById(id);
      const screen = $('s06-screen');
      const L23 = $('s06-l23');
      const L30 = $('s06-l30');
      const L31 = $('s06-l31');
      const L40 = $('s06-l40');
      const L41 = $('s06-l41');
      const HOME = $('s06-lhome');
      const MASK = $('s06-mask');
      const WIPE = $('s06-wipe');

      // Boxes in the 390x844 screen (marks.json names, or measured on the final PNGs).
      const M = {
        cont: { x: 137.6, y: 733.7, w: 236.4, h: 48 },     // onboarding/23-step2-done.cont
        sw: { x: 313, y: 622, w: 46, h: 27 },              // Step 4 switch (measured)
        start: { x: 137.6, y: 718.7, w: 236.4, h: 48 },    // onboarding/41-step4-ack.start
        // Ring boxes on the three Step 4 titles, text-tight (glyphs measured on 40-step4.png):
        // x = glyph left/right -/+ 8; y = cap top - 9.5 -> 1.8 px above each card's sub-line.
        fact1: { x: 75.7, y: 266.2, w: 205.6, h: 27.3 },   // 'SETU never takes your money'
        fact2: { x: 75.7, y: 381.2, w: 156.0, h: 27.3 },   // 'SETU does not deliver'
        fact3: { x: 75.7, y: 479.2, w: 193.6, h: 27.3 },   // 'SETU approves and records'
      };

      const tl = gsap.timeline({ paused: true });

      // K.tap's look and timing, but the ripple stays hidden until the press (the kit's ripple
      // fromTo renders opacity .95 at build time, which would show a ghost dot from frame 0).
      const tap = (parent, x, y, t) => {
        const at = { left: `${x}px`, top: `${y}px` };
        const ripple = K.el('div', 'ripple', parent, at);
        const touch = K.el('div', 'touch', parent, at);
        tl.fromTo(touch, { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'power2.out' }, t);
        tl.to(touch, { scale: 0.82, duration: 0.09, ease: 'power2.in' }, t + 0.2);
        tl.to(touch, { scale: 1, opacity: 0, duration: 0.3, ease: 'power2.out' }, t + 0.32);
        tl.fromTo(ripple, { opacity: 0, scale: 0.35 }, { opacity: 0.95, scale: 0.35, duration: 0.02, ease: 'none' }, t + 0.2);
        tl.to(ripple, { opacity: 0, scale: 2.3, duration: 0.7, ease: 'power2.out' }, t + 0.22);
      };
      // K.swapPush's look and timing; the incoming capture is parked at x 390 only from t, so no
      // layer carries a transform at frame 0 (keeps the s05 cut pixel-identical).
      const push = (from, to, t, dur) => {
        tl.set(to, { opacity: 1, x: 390 }, t);
        tl.to(to, { x: 0, duration: dur, ease: 'expo.inOut' }, t);
        tl.to(from, { x: -110, opacity: 0.35, duration: dur, ease: 'expo.inOut' }, t);
        tl.set(from, { opacity: 0 }, t + dur);
      };
      // Circular reveal of an 'after' capture layer from a tap point.
      const reveal = (el, x, y, r, t, dur, ease) => {
        tl.set(el, { opacity: 1 }, t);
        tl.fromTo(el, { clipPath: `circle(0px at ${x}px ${y}px)` },
          { clipPath: `circle(${r}px at ${x}px ${y}px)`, duration: dur, ease: ease || 'power2.out', immediateRender: false }, t);
      };
      // Kinetic list line: rise + fade (expo.out 0.5 s); its icon draws itself in the same beat.
      const lineIn = (id, t) => {
        const line = $(id);
        tl.fromTo(line, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'expo.out' }, t);
        line.querySelectorAll('svg > *').forEach((shape) => {
          const len = shape.getTotalLength();
          shape.style.strokeDasharray = `${len} ${len + 2}`;
          tl.fromTo(shape, { strokeDashoffset: len + 1 }, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.out' }, t + 0.04);
        });
      };
      const titleRing = (box, t, dur) => K.ring(tl, screen, box, t, dur, { pad: 0, radius: 12 }).classList.add('s06-tring');

      // 0.10 chapter kicker.
      K.fadeUp(tl, '#s06-kicker', 0.10);

      // 0.15 next tap target; 0.40 tap 'Continue'; 0.75 Step 3 pushes in (ring and tap leave with Step 2).
      K.ring(tl, L23, M.cont, 0.15, 0.60, { blue: true, radius: 30 });
      tap(L23, 255.8, 757.7, 0.40);
      push(L23, L30, 0.75, 0.55);

      // Step 3: three quick chip taps in the capture's order; each chip fills from the tap point.
      // r 56 covers the tapped chip's far corners (<= 54.4 px) and stops short of every other tapped
      // chip (South Indian's circle ends at x 204.4; Street Food starts at x 209).
      // Circle centres live in the #s06-l31 mask (CSS); the timeline grows each radius 0 -> 56.
      const chip = (v, t) => tl.fromTo(L31, { [v]: '0px' }, { [v]: '56px', duration: 0.25, ease: 'power2.out' }, t);
      tl.set(L31, { opacity: 1 }, 2.25);
      tap(screen, 148.4, 584.7, 1.90);                  // South Indian (onboarding/31-step3-picked.southIndian)
      chip('--s06-r1', 2.25);
      tap(screen, 259, 585, 2.50);                      // Street Food {209,568,100,34}
      chip('--s06-r2', 2.85);
      tap(screen, 128.5, 413, 3.10);                    // Chinese {90,396,77,34}
      chip('--s06-r3', 3.45);
      // 3.70 the full picked capture takes over (pixel-identical: only those chips differ):
      // one circle grows past every corner (farthest is 633 px from South Indian), so no mask edge is left.
      tl.set(L31, { '--s06-r1': '1000px' }, 3.70);
      tl.set(L30, { opacity: 0 }, 3.70);

      // 4.30 Step 4 pushes in (Step 3's Continue is below the captured viewport: no tap drawn).
      push(L31, L40, 4.30, 0.55);

      // 4.90-5.25 focus mask on the three titles; 6.60-6.90 it lifts, before the switch is ringed.
      tl.fromTo(MASK, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power2.out' }, 4.90);
      tl.to(MASK, { opacity: 0, duration: 0.30, ease: 'power2.inOut' }, 6.60);

      // Kinetic list + an orange ring on each matching title (all rings fade 6.60-6.95).
      lineIn('s06-li1', 4.95);
      titleRing(M.fact1, 4.95, 1.65);
      lineIn('s06-li2', 5.35);
      titleRing(M.fact2, 5.35, 1.25);
      lineIn('s06-li3', 5.75);
      titleRing(M.fact3, 5.75, 0.85);
      tl.to(['#s06-li1', '#s06-li2', '#s06-li3'], { y: -10, opacity: 0, duration: 0.26, ease: 'power2.in', stagger: 0.02 }, 6.95);

      // 6.90 next tap target: the switch; 7.10 tap; 7.45 the switch turns on and 'Start ordering' wakes.
      // r 340: the farthest changed pixel (the ack card's left border) is 324 px from the switch.
      K.ring(tl, screen, M.sw, 6.90, 0.55, { blue: true, radius: 20 });
      tap(screen, 336, 635, 7.10);
      reveal(L41, 336, 635, 340, 7.45, 0.35);
      tl.set(L41, { clipPath: 'none' }, 7.80);

      // 7.85 next tap target; 8.40 tap 'Start ordering'; 8.75 commit wipe into Home.
      K.ring(tl, screen, M.start, 7.85, 0.90, { blue: true, radius: 30 });
      tap(screen, 255.8, 742.7, 8.40);
      screen.appendChild(WIPE);                         // the wipe covers every ring and tap
      reveal(WIPE, 255.8, 742.7, 790, 8.75, 0.45, 'power2.in');
      tl.set(HOME, { opacity: 1 }, 9.20);
      tl.set([L40, L41], { opacity: 0 }, 9.20);
      tl.to(WIPE, { opacity: 0, duration: 0.3, ease: 'power2.inOut' }, 9.20);

      // 9.15-9.45 kicker out; 9.50-9.55 hold on Home at identity.
      K.fadeOut(tl, '#s06-kicker', 9.15, { dur: 0.30 });

      window.__timelines['s06-your-picks'] = tl;
    }());
  </script>
</template>
</body>
</html>
