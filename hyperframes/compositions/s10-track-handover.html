<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template id="s10-track-handover-template">
  <link rel="stylesheet" href="assets/css/kit.css" />
  <style>
    #root { position: absolute; inset: 0; }
    #root .rig { position: absolute; inset: 0; transform-origin: 0 0; }
    #s10-kicker { position: absolute; left: 140px; top: 200px; opacity: 0; }
    /* tag row: TIME-LAPSE (Lucide fast-forward + Space Mono caps, pale pill) */
    #s10-tag {
      position: absolute; left: 140px; top: 112px; box-sizing: border-box; height: 38px;
      display: inline-flex; align-items: center; gap: 10px; padding: 0 14px 0 14px;
      border-radius: 999px; border: 1.5px solid rgba(184, 199, 255, .6); background: rgba(184, 199, 255, .1);
      color: var(--pale); font: 700 18px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase;
      white-space: nowrap; opacity: 0;
    }
    #s10-tag svg { width: 20px; height: 20px; flex: none; }
    #s10-tag span { margin-right: -.16em; }
    /* status rail (canvas coordinates; container is not full-frame) */
    #s10-rail { position: absolute; left: 0; top: 0; width: 720px; height: 720px; }
    #s10-rail-head {
      position: absolute; left: 150px; top: 290px; white-space: nowrap; opacity: 0;
      font: 700 18px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--pale);
    }
    #s10-rail-svg { position: absolute; left: 152px; top: 342px; width: 20px; height: 336px; overflow: visible; }
    #s10-rail-base { fill: none; stroke: rgba(255, 255, 255, .35); stroke-width: 2; }
    #s10-rail-prog { fill: none; stroke: var(--pale); stroke-width: 2.5; stroke-dasharray: 315; stroke-dashoffset: 315; }
    #s10-rail .s10-row { position: absolute; left: 0; width: 720px; height: 0; }
    #s10-rail .s10-dot, #s10-rail .s10-halo {
      position: absolute; left: 155px; top: -7px; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; opacity: 0;
    }
    #s10-rail .s10-dot--todo { background: #0E1538; border: 2px solid rgba(255, 255, 255, .35); }
    #s10-rail .s10-dot--done { background: var(--pale); }
    #s10-rail .s10-dot--now { background: var(--orange); box-shadow: 0 0 0 5px rgba(236, 90, 42, .22), 0 0 18px rgba(236, 90, 42, .6); }
    #s10-rail .s10-halo { border: 2px solid var(--orange); }
    #s10-rail .s10-name {
      position: absolute; left: 192px; top: -19px; font: 600 28px/36px var(--font-ui); color: #fff;
      letter-spacing: -.005em; white-space: nowrap; opacity: 0;
    }
    #s10-flash {
      position: absolute; left: 142px; top: 641px; width: 300px; height: 52px; border-radius: 26px; opacity: 0;
      background: rgba(236, 90, 42, .16); box-shadow: 0 0 34px rgba(236, 90, 42, .32);
    }
    /* callout lane: HANDOVER CODE label + leader; voice arcs */
    #s10-code-label.callout {
      right: 831px; top: 464px; padding: 9px 14.6px 9px 16px;
      font: 700 18px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase;
    }
    #s10-leader { position: absolute; left: 1080px; top: 474px; width: 90px; height: 18px; overflow: visible; }
    #s10-leader path { fill: none; stroke: rgba(184, 199, 255, .7); stroke-width: 2; }
    #s10-arcs { position: absolute; left: 1016px; top: 456px; width: 84px; height: 120px; overflow: visible; filter: drop-shadow(0 0 6px rgba(184, 199, 255, .55)); }
    #s10-arcs path { fill: none; stroke: var(--pale); stroke-width: 2; stroke-linecap: round; opacity: 0; }
    /* ring variants inside the screen (same geometry as kit rings) */
    #s10-screen .s10-ring--ok { border-color: var(--ok); box-shadow: 0 0 0 6px rgba(25, 179, 107, .18), 0 0 26px rgba(25, 179, 107, .38); }
    #s10-screen .s10-ring--thin { border-width: 2px; box-shadow: 0 0 10px rgba(236, 90, 42, .28); }
    /* the app's own sheet scrim (sampled from 09: rgba(10,11,27,.4)) over the band the sheet has not covered yet */
    #s10-screen .s10-band { position: absolute; left: 0; top: 412px; width: 390px; height: 432px; background: rgba(10, 11, 27, .4); opacity: 0; }
  </style>
  <div id="root" data-composition-id="s10-track-handover" data-width="1920" data-height="1080">
    <div class="rig" id="s10-rig">
      <div class="phone" id="s10-phone" data-layout-allow-overflow>
        <div class="side-btn" style="top:190px;height:70px"></div>
        <div class="side-btn" style="top:290px;height:120px"></div>
        <div class="glass"><div class="screen" id="s10-screen"></div></div>
      </div>
    </div>
    <div class="kicker" id="s10-kicker">08 · Track &amp; hand over</div>
    <div id="s10-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6a2 2 0 0 1 3.414-1.414l6 6a2 2 0 0 1 0 2.828l-6 6A2 2 0 0 1 12 18z" /><path d="M2 6a2 2 0 0 1 3.414-1.414l6 6a2 2 0 0 1 0 2.828l-6 6A2 2 0 0 1 2 18z" /></svg><span>Time-lapse</span></div>
    <div id="s10-rail">
      <div id="s10-rail-head">Status timeline · not a map</div>
      <div id="s10-flash"></div>
      <svg id="s10-rail-svg" viewBox="152 342 20 336" aria-hidden="true">
        <path id="s10-rail-base" d="M162 352 V667" />
        <path id="s10-rail-prog" d="M162 352 V667" />
      </svg>
    </div>
    <div class="callout callout--dark" id="s10-code-label">Handover code</div>
    <svg id="s10-leader" viewBox="1080 474 90 18" aria-hidden="true"><path id="s10-leader-path" d="M1089 483 H1161" /></svg>
    <svg id="s10-arcs" viewBox="1016 456 84 120" aria-hidden="true">
      <path id="s10-arc-1" vector-effect="non-scaling-stroke" d="M1067.14 500.68 A20 20 0 0 0 1067.14 531.32" />
      <path id="s10-arc-2" vector-effect="non-scaling-stroke" d="M1058.14 489.95 A34 34 0 0 0 1058.14 542.05" />
      <path id="s10-arc-3" vector-effect="non-scaling-stroke" d="M1049.15 479.23 A48 48 0 0 0 1049.15 552.77" />
    </svg>
  </div>
  <script>
    (function () {
      const K = window.SetuKit;
      const spec = { left: 1150, top: 70, k: 1.08 };
      K.placePhone(document.getElementById('s10-phone'), spec);
      const screen = document.getElementById('s10-screen');
      const rig = document.getElementById('s10-rig');
      const UI = 'assets/ui/order-cash/';

      // Real captures, stacked in story order (later layers on top).
      const L01 = K.layer(screen, `${UI}01-placed.png`, 's10-l01', { visible: true });
      const L02 = K.layer(screen, `${UI}02-accepted.png`, 's10-l02');
      const L04 = K.layer(screen, `${UI}04-preparing.png`, 's10-l04');
      const L06 = K.layer(screen, `${UI}06-ready.png`, 's10-l06');
      const L07 = K.layer(screen, `${UI}07-on-the-way-code.png`, 's10-l07');
      const L08 = K.layer(screen, `${UI}08-cash-confirmed.png`, 's10-l08');

      // Boxes in screen px, measured on the 3x PNGs (see .preview/s10-track-handover/plan.md).
      const HEADER = { x: 68, y: 19, w: 234, h: 32 };          // status headline + 'Southside Tiffins · CE1013-BCQK · ₹150'
      const PAY = { x: 25, y: 455, w: 340, h: 34 };            // 07 'Please pay ₹150 in cash'
      const CODE07 = { x: 21, y: 494.5, w: 348, h: 58.5 };     // 07.code {25,498.8,340,48}, ring clear of the digit boxes
      const CASH_OK = { x: 25, y: 473, w: 340, h: 34 };        // 08 'The stall has confirmed your ₹150 cash payment'
      const CODE08 = { x: 21, y: 512.5, w: 348, h: 58.5 };     // 08.code {25,517,340,48}
      const TELL = { x: 22.5, y: 576, w: 317, h: 18 };         // 08 'Now tell them this code — that completes your order.'

      // Status rail rows (the progress view's own labels).
      const NAMES = ['Placed', 'Confirmed', 'Preparing', 'Ready', 'Out for delivery', 'Delivered'];
      const Y = [352, 415, 478, 541, 604, 667];
      const rail = document.getElementById('s10-rail');
      const rows = NAMES.map((name, i) => {
        const r = K.el('div', 's10-row', rail, { top: `${Y[i]}px` });
        r.id = `s10-row-${i}`;
        const todo = K.el('div', 's10-dot s10-dot--todo', r);
        const done = K.el('div', 's10-dot s10-dot--done', r);
        const now = K.el('div', 's10-dot s10-dot--now', r);
        const halo = K.el('div', 's10-halo', r);
        const label = K.el('div', 's10-name', r);
        label.textContent = name;
        return { todo, done, now, halo, label };
      });
      const prog = document.getElementById('s10-rail-prog');

      const tl = gsap.timeline({ paused: true });

      // ── 0.10–0.80 chapter kicker, TIME-LAPSE tag, rail build ─────────────
      K.fadeUp(tl, '#s10-kicker', 0.10);
      tl.fromTo('#s10-tag', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: 'expo.out' }, 0.20);
      tl.fromTo('#s10-rail-head', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, 0.20);
      K.drawPath(tl, document.getElementById('s10-rail-base'), 0.20, 0.6);
      // Rows arrive as the power2.inOut line reaches them.
      const ENTER = [0.20, 0.39, 0.47, 0.53, 0.61, 0.80];
      rows.forEach((R, i) => {
        tl.fromTo(R.todo, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, ENTER[i]);
        tl.fromTo(R.label, { opacity: 0, x: -14 }, { opacity: i === 0 ? 1 : 0.35, x: 0, duration: 0.5, ease: 'expo.out' }, ENTER[i] + 0.03);
      });

      // Row k becomes the current status at T; the previous row turns done.
      function lightRow(k, T) {
        const R = rows[k];
        tl.fromTo(R.now, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2.2)' }, T);
        tl.fromTo(R.halo, { opacity: 0, scale: 1 }, { opacity: 0.9, scale: 1.3, duration: 0.1, ease: 'power1.out' }, T);
        tl.to(R.halo, { opacity: 0, scale: 3, duration: 0.5, ease: 'power2.out' }, T + 0.1);
        if (k === 0) return;
        tl.to(R.label, { opacity: 1, duration: 0.3, ease: 'power1.out' }, T);
        const P = rows[k - 1];
        tl.to(P.now, { opacity: 0, duration: 0.25, ease: 'power1.in' }, T);
        tl.fromTo(P.done, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power1.out' }, T);
        tl.to(prog, { strokeDashoffset: 315 - (Y[k] - 352), duration: 0.45, ease: 'expo.inOut' }, T - 0.05);
      }

      // ── 0.40–4.80 status run: the stall's actions, in place (no taps) ──
      const RUN = [[0.40, null], [1.20, L02], [2.40, L04], [3.60, L06], [4.80, L07]];
      let shown = L01;
      RUN.forEach(([T, layer], k) => {
        if (layer) { K.swapFade(tl, shown, layer, T, 0.25); shown = layer; }
        K.ring(tl, screen, HEADER, T, 0.6, { radius: 14 });
        lightRow(k, T);
      });
      tl.to('#s10-tag', { opacity: 0, y: -8, duration: 0.3, ease: 'power1.in' }, 5.10);

      // ── 5.10–6.10 camera Fhand: the handover panel fills the frame ──────
      K.focus(tl, rig, K.toCanvas(spec, 195, 532), 1.7, 5.10, 1.0, { to: { x: 1480, y: 500 } });

      // ── 6.10–8.30 pay cash first, then the code ─────────────────────────
      K.ring(tl, screen, PAY, 6.10, 1.2, { pad: 2, radius: 15 });
      K.ring(tl, screen, CODE07, 6.80, 1.15, { pad: 0, radius: 16, blue: true });   // fade done 8.30
      K.callout(tl, '#s10-code-label', 6.90);
      K.drawPath(tl, document.getElementById('s10-leader-path'), 7.05, 0.3, { ease: 'power2.out' });
      tl.to(['#s10-code-label', '#s10-leader'], { opacity: 0, duration: 0.3, ease: 'power1.in' }, 8.00);   // gone as the 8.30 swap starts

      // ── 8.30 the stall confirms the cash; camera stays ──────────────────
      K.swapFade(tl, L07, L08, 8.30, 0.25);
      K.ring(tl, screen, CASH_OK, 8.60, 1.2, { pad: 2, radius: 15 }).classList.add('s10-ring--ok');
      K.ring(tl, screen, CODE08, 9.60, 1.5, { pad: 0, radius: 16 });
      K.ring(tl, screen, TELL, 9.60, 1.5, { pad: 1.5, radius: 8 }).classList.add('s10-ring--thin');

      // ── 9.80–11.10 the code is said out loud: three arcs ripple once ────
      // Each arc ripples out once (0.35 s apart), settles to an echo, and all clear by 11.10.
      ['#s10-arc-1', '#s10-arc-2', '#s10-arc-3'].forEach((id, i) => {
        const t = 9.80 + i * 0.35;
        tl.fromTo(id, { opacity: 0, scale: 0.8, svgOrigin: '1080 516' },
          { opacity: 1, scale: 1, svgOrigin: '1080 516', duration: 0.3, ease: 'expo.out' }, t);
        if (i < 2) tl.to(id, { opacity: 0.4, duration: 0.3, ease: 'power1.inOut' }, t + 0.3);
        tl.to(id, { opacity: 0, duration: 0.3, ease: 'power1.in' }, 10.80);
      });

      // ── 11.10–11.90 back to identity; the code completes it: Delivered ──
      K.unfocus(tl, rig, 11.10, 0.8);
      // K.swapSheet's look and timing, but the sheet is parked below the fold only from 11.30 (the kit's
      // fromTo parks a visible, transformed sheet from frame 0, which changes how Chrome rasterizes the
      // visible capture and makes frame 0 differ from s09's settled last frame).
      const scrim = K.layer(screen, `${UI}09-delivered-review.png`, null);
      const sheet = K.layer(screen, `${UI}09-delivered-review.png`, null);
      scrim.style.clipPath = `inset(0 0 ${844 - 412}px 0)`;
      sheet.style.clipPath = 'inset(412px 0 0 0)';
      tl.to(scrim, { opacity: 1, duration: 0.55 * 0.8, ease: 'power1.out' }, 11.30);
      tl.set(sheet, { opacity: 1, y: 844 - 412 }, 11.30);
      tl.to(sheet, { y: 0, duration: 0.55, ease: 'expo.out' }, 11.30);
      const band = K.el('div', 's10-band');
      screen.insertBefore(band, sheet);
      tl.fromTo(band, { opacity: 0 }, { opacity: 1, duration: 0.44, ease: 'power1.out' }, 11.30);
      const L09 = K.layer(screen, `${UI}09-delivered-review.png`, 's10-l09');
      tl.set(L09, { opacity: 1 }, 11.86);                    // one clean still for the cut
      lightRow(5, 11.30);
      tl.fromTo('#s10-flash', { opacity: 0, scaleX: 0.7 }, { opacity: 1, scaleX: 1, duration: 0.25, ease: 'expo.out' }, 11.30);
      K.fadeOut(tl, ['#s10-kicker', '#s10-rail'], 11.55, { dur: 0.35 });

      window.__timelines['s10-track-handover'] = tl;
    }());
  </script>
</template>
</body>
</html>
