<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template id="s05-delivery-spot-template">
  <link rel="stylesheet" href="assets/css/kit.css" />
  <style>
    #root { position: absolute; inset: 0; }
    #root .rig { position: absolute; inset: 0; transform-origin: 0 0; }
    #s05-kicker { position: absolute; left: 140px; top: 200px; opacity: 0; }

    /* Explainer inset: SETU's own location dialog at the phone's own scale (1.08x). */
    #s05-inset { position: absolute; left: 420px; top: 300px; width: 378px; height: 316.4px; opacity: 0; }
    #s05-inset-clip {
      position: absolute; inset: 0; overflow: hidden; border-radius: 26px; background: #fff;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
    }
    #s05-inset-clip img { position: absolute; left: -21.6px; top: -298.08px; width: 421.2px; height: 911.52px; display: block; }
    #s05-nn-ring { left: 17.8px; top: 205.1px; width: 171.6px; height: 63.9px; border-radius: 30px; }
    #s05-opt {
      position: absolute; left: 420px; top: 250px; width: 148px; height: 38px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center; border-radius: 999px;
      border: 2px solid #EC5A2A; background: rgba(12, 18, 51, .88); color: #fff;
      font: 700 18px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; opacity: 0;
    }

    /* Callout-lane labels (Fconf: right edge <= 1087). */
    #s05-lbl-zone.callout, #s05-lbl-bound.callout {
      height: 38px; box-sizing: border-box; padding: 0 16px; justify-content: center;
      font: 700 18px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase;
    }
    #s05-lbl-zone.callout { left: 900px; top: 319.5px; width: 185px; }
    #s05-lbl-bound.callout { left: 852px; top: 246.6px; width: 234px; }

    /* Canvas-level lines: leaders, the inset's dashed leader, the pin's dotted trail. */
    #s05-lines { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }
    #s05-lines .s05-lead { fill: none; stroke: rgba(184, 199, 255, .7); stroke-width: 2; }
    #s05-lines .s05-mask { fill: none; stroke: #fff; stroke-width: 10; }
    #s05-dash { stroke-dasharray: 6 6; }
    #s05-trail { fill: none; stroke: rgba(184, 199, 255, .9); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 0 9; }

    /* Rings: pale = context (never tapped); green = inside the delivery area; fine = under the 1.8x push-in. */
    .ring.s05-ring-pale { border-color: #B8C7FF; box-shadow: 0 0 0 6px rgba(184, 199, 255, .16), 0 0 22px rgba(184, 199, 255, .3); }
    .ring.s05-ring-green { border-color: #19B36B; box-shadow: 0 0 0 6px rgba(25, 179, 107, .18), 0 0 26px rgba(25, 179, 107, .38); }
    .ring.s05-ring-fine { border-width: 2px; }
    .s05-halo { position: absolute; left: 159px; top: 420px; width: 72px; height: 72px; box-sizing: border-box;
      border: 2px solid #EC5A2A; border-radius: 50%; opacity: 0; pointer-events: none; }

    /* Pin -> saved-address card. */
    #s05-pin { position: absolute; left: 1775.5px; top: 97.9px; width: 36px; height: 36px; opacity: 0; }
    #s05-pin svg { display: block; width: 36px; height: 36px; }
    #s05-card { left: 140px; top: 420px; width: 420px; height: 110px; box-sizing: border-box; opacity: 0;
      display: flex; align-items: center; gap: 20px; padding: 0 26px; transform-origin: 160px 50px; }
    #s05-card-ic { width: 56px; height: 56px; flex: none; border-radius: 18px; display: flex; align-items: center; justify-content: center;
      background: rgba(236, 90, 42, .14); border: 1px solid rgba(236, 90, 42, .42); box-sizing: border-box; }
    #s05-card-ic svg { width: 28px; height: 28px; display: block; }
    #s05-card-t { font: 700 32px/1.15 var(--font-ui); color: #fff; white-space: nowrap; }
    #s05-card-s { font: 500 22px/1.3 var(--font-ui); color: #B8C7FF; white-space: nowrap; margin-top: 4px; }
  </style>
  <div id="root" data-composition-id="s05-delivery-spot" data-width="1920" data-height="1080">
    <div class="rig" id="s05-rig" data-layout-allow-overflow>
      <div class="phone" id="s05-phone">
        <div class="side-btn" style="top:190px;height:70px"></div>
        <div class="side-btn" style="top:290px;height:120px"></div>
        <div class="glass"><div class="screen" id="s05-screen">
          <div class="layer" id="s05-ts"><video id="s05-v-ts" class="clip" src="assets/clips/location-11-type-search.800ms.mp4" muted playsinline data-start="3.85" data-duration="0.8" data-hf-media-start-basis="local" data-track-index="3"></video></div>
          <div class="layer" id="s05-tr"><video id="s05-v-tr" class="clip" src="assets/clips/location-14-type-room.800ms.mp4" muted playsinline data-start="11" data-duration="0.8" data-hf-media-start-basis="local" data-track-index="3"></video></div>
        </div></div>
      </div>
    </div>

    <div class="kicker" id="s05-kicker">03 · Delivery spot</div>

    <div id="s05-inset">
      <div id="s05-inset-clip" data-layout-allow-overflow><img src="assets/ui/location/01-allow-dialog.png" alt="" /></div>
      <div class="ring" id="s05-nn-ring"></div>
    </div>
    <div id="s05-opt">Optional</div>

    <div class="callout callout--dark" id="s05-lbl-zone">Campus only</div>
    <div class="callout callout--dark" id="s05-lbl-bound">Campus boundary</div>

    <svg id="s05-lines" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <defs>
        <mask id="s05-m-dash" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
          <path class="s05-mask" id="s05-mp-dash" d="M798 458 L1181.3 596.7" />
        </mask>
        <mask id="s05-m-trail" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
          <path class="s05-mask" id="s05-mp-trail" d="M1090 282.7 L300 470" />
        </mask>
      </defs>
      <path class="s05-lead" id="s05-dash" d="M798 458 L1181.3 596.7" mask="url(#s05-m-dash)" />
      <path class="s05-lead" id="s05-lz" d="M1085 338.5 L1173.4 338.5" />
      <path class="s05-lead" id="s05-lb" d="M1086 265.6 L1298.4 265.6" />
      <path id="s05-trail" d="M1090 282.7 L300 470" mask="url(#s05-m-trail)" />
    </svg>

    <div id="s05-pin"><svg viewBox="0 0 24 24" fill="none" stroke="#EC5A2A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /><circle cx="12" cy="10" r="3" /></svg></div>

    <div class="glass-card" id="s05-card">
      <div id="s05-card-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#EC5A2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg></div>
      <div id="s05-card-tx"><div id="s05-card-t">Home · B-212</div><div id="s05-card-s">Nehru Hall of Residence</div></div>
    </div>
  </div>
  <script>
    (function () {
      const K = window.SetuKit;
      const spec = { left: 1150, top: 70, k: 1.08 };
      K.placePhone(document.getElementById('s05-phone'), spec);
      const screen = document.getElementById('s05-screen');
      const rig = document.getElementById('s05-rig');
      const ts = document.getElementById('s05-ts');
      const tr = document.getElementById('s05-tr');
      const $ = (id) => document.getElementById(id);

      // Real captures, stacked bottom -> top around the two clip layers.
      const before = (ref, src, id, o) => screen.insertBefore(K.layer(screen, src, id, o), ref);
      const done = before(ts, 'assets/ui/onboarding/23-step2-done.png', 's05-done');
      const prompt = before(ts, 'assets/ui/onboarding/21-step2-prompt.png', 's05-prompt', { visible: true });
      const pickSrc = 'assets/ui/location/10-picker-select.png';
      const results = before(ts, 'assets/ui/location/12-search-results.png', 's05-results');
      const conf1 = before(tr, 'assets/ui/location/13-confirm-search.png', 's05-conf1');
      const map = before(tr, 'assets/ui/location/20-map.png', 's05-map');
      const conf2 = before(tr, 'assets/ui/location/13-confirm-search.png', 's05-conf2');
      const homeScrim = before(tr, 'assets/ui/location/15-confirm-home.png', 's05-home-scrim');
      const homeSheet = before(tr, 'assets/ui/location/15-confirm-home.png', 's05-home-sheet');
      homeScrim.style.clipPath = 'inset(0 0 576px 0)';
      homeSheet.style.clipPath = 'inset(268px 0 0 0)';

      // Boxes in screen CSS px (marks.json, or measured on the final PNGs).
      const M = {
        gps: { x: 16, y: 441.7, w: 358, h: 66 },          // onboarding/21-step2-prompt.gps
        box: { x: 16, y: 309.7, w: 358, h: 104 },         // onboarding/21-step2-prompt.box (= 23.box)
        search: { x: 78, y: 647.5, w: 261, h: 23 },       // location/10-picker-select.search (tap centre)
        field: { x: 36, y: 636, w: 318, h: 46 },          // the search field itself (measured)
        first: { x: 18, y: 207.6, w: 354, h: 66 },        // location/12-search-results.first
        zone: { x: 33, y: 469, w: 314, h: 17 },           // check icon + 'Location is within…' (measured; zoneOk is text-only)
        adjustRow: { x: 18, y: 684, w: 354, h: 66 },      // 'Adjust on the map' row (measured)
        adjust: { x: 84, y: 699, w: 243, h: 18 },         // location/13-confirm-search.adjust
        useThis: { x: 183.5, y: 782, w: 188.5, h: 48 },   // location/20-map.useThis
        home13: { x: 18, y: 519, w: 90, h: 38 },          // location/13-confirm-search.home
        home15: { x: 18, y: 544, w: 90, h: 38 },          // location/15-confirm-home.home
        details: { x: 18, y: 616, w: 354, h: 56 },        // location/15-confirm-home.details
        confirm: { x: 181.6, y: 782, w: 190.4, h: 48 },   // location/15-confirm-home.confirm
      };

      const tl = gsap.timeline({ paused: true });
      // K.tap's look and timing, but the ripple stays hidden until the press (kit's fromTo shows it from t=0).
      const tap = (box, t) => {
        const c = K.center(box); const at = { left: `${c.x}px`, top: `${c.y}px` };
        const ripple = K.el('div', 'ripple', screen, at); const touch = K.el('div', 'touch', screen, at);
        tl.fromTo(touch, { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'power2.out' }, t);
        tl.to(touch, { scale: 0.82, duration: 0.09, ease: 'power2.in' }, t + 0.2);
        tl.to(touch, { scale: 1, opacity: 0, duration: 0.3, ease: 'power2.out' }, t + 0.32);
        tl.fromTo(ripple, { opacity: 0, scale: 0.35 }, { opacity: 0.95, scale: 0.35, duration: 0.02, ease: 'none' }, t + 0.2);
        tl.to(ripple, { opacity: 0, scale: 2.3, duration: 0.7, ease: 'power2.out' }, t + 0.22);
      };
      const ring = (parent, box, t, dur, o = {}) => {
        const r = K.ring(tl, parent, box, t, dur, o);
        (o.cls || []).forEach((c) => r.classList.add(c));
        return r;
      };
      const FINE = ['s05-ring-fine'];
      // GSAP expo.inOut, used to keep the dotted trail's head under the flying pin.
      const expoIn = (p) => (p ? Math.pow(2, 10 * (p - 1)) : 0);
      const expoInOut = (p) => (p < 0.5 ? expoIn(p * 2) / 2 : 1 - expoIn((1 - p) * 2) / 2);
      const P0 = (1793.5 - 1090) / 1493.5;   // fraction of the flight where the trail starts (x 1090, left of the bezel)
      const trailEase = (u) => Math.min(1, Math.max(0, (expoInOut(0.5 + 0.5 * u) - P0) / (1 - P0)));

      // ── 0.10 kicker ───────────────────────────────────────────────
      K.fadeUp(tl, '#s05-kicker', 0.1);

      // ── 0.25–2.20 explainer inset: location access is optional ────
      tl.fromTo('#s05-inset', { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.4)' }, 0.25);
      tl.fromTo('#s05-opt', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: 'expo.out' }, 0.25);
      K.drawPath(tl, $('s05-mp-dash'), 0.35, 0.4);
      ring(prompt, M.gps, 0.35, 1.4, { cls: ['s05-ring-pale'] });
      tl.fromTo('#s05-nn-ring', { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2)' }, 0.75);
      tl.to('#s05-nn-ring', { opacity: 0, duration: 0.3, ease: 'power1.in' }, 1.8);
      tl.to(['#s05-inset', '#s05-opt', '#s05-dash'], { opacity: 0, duration: 0.3, ease: 'power1.in' }, 1.9);

      // ── 1.85–2.90 tap the Delivery location box → picker sheet ─────
      ring(prompt, M.box, 1.85, 0.55, { blue: true, radius: 18 });
      tap(M.box, 2.05);
      const pick = K.swapSheet(screen, tl, prompt, pickSrc, 2.4, 537, 0.5);
      screen.insertBefore(pick.scrim, results);
      screen.insertBefore(pick.sheet, results);
      tl.set(prompt, { opacity: 0 }, 2.9);

      // ── 3.30–4.65 search → typing clip → results ──────────────────
      ring(pick.sheet, M.field, 3.3, 0.55, { blue: true, pad: 4, radius: 16 });
      tap(M.search, 3.5);
      tl.fromTo(ts, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power1.inOut' }, 3.85);
      tl.set(results, { opacity: 1 }, 4.65);
      tl.set([ts, pick.scrim, pick.sheet], { opacity: 0 }, 4.65);

      // ── 4.85–5.95 first result → Confirm; 6.00–7.00 camera Fconf ──
      ring(results, M.first, 4.85, 1.1, { blue: true, radius: 18 });
      tap(M.first, 5.6);
      K.swapFade(tl, results, conf1, 5.95, 0.3);
      K.focus(tl, rig, K.toCanvas(spec, 195, 575), 1.8, 6.0, 1.0, { to: { x: 1500, y: 528 } });

      // ── 6.65–8.05 inside the delivery area ───────────────────────
      ring(conf1, M.zone, 6.65, 1.3, { radius: 12, cls: ['s05-ring-green', 's05-ring-fine'] });
      tl.fromTo('#s05-lbl-zone', { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: 'expo.out' }, 6.75);
      K.drawPath(tl, $('s05-lz'), 6.8, 0.25, { ease: 'power2.out' });
      tl.to(['#s05-lbl-zone', '#s05-lz'], { opacity: 0, duration: 0.3, ease: 'power1.in' }, 7.75);

      // ── 7.75–9.70 'Adjust on the map' → map, pin halo, boundary ───
      ring(conf1, M.adjustRow, 7.75, 0.55, { blue: true, pad: 4, radius: 18, cls: FINE });
      tap(M.adjust, 7.95);
      K.swapFade(tl, conf1, map, 8.3, 0.35);
      [8.65, 8.95].forEach((t) => {
        const h = K.el('div', 's05-halo', map);
        tl.fromTo(h, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: 'none' }, t);
        tl.fromTo(h, { scale: 0.08 }, { scale: 1, duration: 0.5, ease: 'power2.out' }, t);
        tl.to(h, { opacity: 0, duration: 0.4, ease: 'power1.in' }, t + 0.1);
      });
      tl.fromTo('#s05-lbl-bound', { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: 'expo.out' }, 8.7);
      K.drawPath(tl, $('s05-lb'), 8.75, 0.3, { ease: 'power2.out' });
      tl.to(['#s05-lbl-bound', '#s05-lb'], { opacity: 0, duration: 0.3, ease: 'power1.in' }, 9.7);
      ring(map, M.useThis, 9.15, 0.55, { blue: true, pad: 5, radius: 30, cls: FINE });
      tap(M.useThis, 9.35);
      K.swapFade(tl, map, conf2, 9.7, 0.35);

      // ── 10.40–11.80 Home chip → typing clip (B-212) → 15 holds ────
      ring(conf2, M.home13, 10.4, 0.6, { blue: true, pad: 4, radius: 23, cls: FINE });
      tap(M.home13, 10.65);
      tl.fromTo(tr, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power1.inOut' }, 11.0);
      tl.set([homeScrim, homeSheet, done], { opacity: 1 }, 11.25);
      tl.set([conf2], { opacity: 0 }, 11.25);
      tl.set(tr, { opacity: 0 }, 11.8);

      // ── 11.85–13.50 rings, 'Confirm location', the sheet closes ───
      ring(homeSheet, M.home15, 11.85, 0.8, { pad: 4, radius: 23, cls: FINE });
      ring(homeSheet, M.details, 11.85, 0.8, { pad: 4, radius: 18, cls: FINE });
      ring(homeSheet, M.confirm, 12.5, 0.55, { blue: true, pad: 5, radius: 30, cls: FINE });
      tap(M.confirm, 12.7);
      tl.to(homeScrim, { opacity: 0, duration: 0.35, ease: 'power1.inOut' }, 13.05);
      tl.to(homeSheet, { y: 576, duration: 0.45, ease: 'expo.in' }, 13.05);

      // ── 13.45–14.50 pin → saved-address card ─────────────────────
      ring(done, M.box, 13.55, 1.0, { radius: 18, cls: FINE });
      tl.fromTo('#s05-pin', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(2)' }, 13.45);
      tl.fromTo('#s05-pin', { x: 0, y: 0 }, { x: -1493.5, y: 354.1, duration: 0.5, ease: 'expo.inOut', immediateRender: false }, 13.55);
      K.drawPath(tl, $('s05-mp-trail'), 13.8, 0.25, { ease: trailEase });
      tl.to('#s05-pin', { opacity: 0, scale: 0.6, duration: 0.18, ease: 'power2.in' }, 14.0);
      tl.fromTo('#s05-card', { opacity: 0, scaleX: 0.1, scaleY: 0.4 }, { opacity: 1, scaleX: 1, scaleY: 1, duration: 0.45, ease: 'expo.out' }, 14.0);
      tl.fromTo('#s05-card-ic, #s05-card-tx', { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.35, ease: 'expo.out' }, 14.1);
      tl.to('#s05-trail', { opacity: 0, duration: 0.3, ease: 'power1.in' }, 14.2);

      // ── 14.65–16.05 camera home, clear, hold Step 2 (filled) ──────
      K.unfocus(tl, rig, 14.65, 0.9);
      tl.to(['#s05-card', '#s05-kicker'], { opacity: 0, duration: 0.3, ease: 'power1.in' }, 15.65);

      window.__timelines['s05-delivery-spot'] = tl;
    }());
  </script>
</template>
</body>
</html>
