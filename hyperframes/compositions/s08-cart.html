<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template id="s08-cart-template">
  <link rel="stylesheet" href="assets/css/kit.css" />
  <style>
    #root { position: absolute; inset: 0; }
    #root .rig { position: absolute; inset: 0; transform-origin: 0 0; }
    #s08-kicker { position: absolute; left: 140px; top: 200px; }

    /* Order slip carried from s07 (handoffIn): one wrapper, 600x132 at (140,340); rows at top 340 / 412. */
    #s08-slip { position: absolute; left: 140px; top: 340px; width: 600px; height: 132px; }
    /* Each row flies on its own; anchor = its left-middle point. */
    #s08-row1, #s08-row2 { left: 0; opacity: 1; transform-origin: 0% 50%; }
    #s08-row1 { top: 0; }
    #s08-row2 { top: 72px; }
    .s08-qty { font: 700 26px/1 var(--font-mono); color: #EC5A2A; }
    /* Ink plate under each row's text: fades in mid-flight so the slip still reads over the white cart.
       It is out of flow (absolute); the row's content is positioned, so DOM order paints it on top. */
    .s08-plate { position: absolute; inset: 0; border-radius: 21px; background: rgba(12, 18, 51, .94);
      box-shadow: 0 10px 26px rgba(3, 6, 20, .38); opacity: 0; }
    .s08-qty, .s08-nm, #s08-row1 b, #s08-row2 b { position: relative; }

    /* Left-column math (canvas level, x 140-700). */
    .s08-lab { position: absolute; left: 140px; font: 700 18px/1 var(--font-mono); letter-spacing: .1em;
      text-transform: uppercase; color: #B8C7FF; white-space: nowrap; opacity: 0; }
    .s08-val { position: absolute; left: 140px; font: 800 64px/1 var(--font-ui); letter-spacing: -.02em;
      color: #fff; white-space: nowrap; opacity: 0; }
    #s08-l1 { top: 300px; }
    #s08-v1 { top: 322px; }
    #s08-l2 { top: 410px; }
    #s08-v2 { top: 432px; }
    #s08-l3 { top: 540px; }
    #s08-v3 { top: 562px; }
    #s08-rule { position: absolute; left: 140px; top: 523px; width: 460px; height: 2px; border-radius: 1px;
      background: #EC5A2A; transform-origin: 0 50%; }

    /* Callout-lane label + leader (Ftotals: label right edge 1092 <= 1095). */
    #s08-tag-fee { left: 846px; top: 478px; width: 246px; height: 38px; box-sizing: border-box; padding: 0 16px;
      justify-content: center; font: 700 18px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
    #s08-leader { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; opacity: 0; }
    #s08-leader path { fill: none; stroke: rgba(184, 199, 255, .7); stroke-width: 2; }

    /* Holds one K.tap ripple (screen-px plane) so it stays hidden until its own start. */
    .s08-ripwrap { position: absolute; left: 0; top: 0; width: 390px; height: 844px; pointer-events: none; opacity: 0; }

    /* Rings shown under the 1.62x push-in: 2 px here reads like the kit's 3 px ring at identity. */
    .ring.s08-ring-fine { border-width: 2px; }

    /* ₹150 number flight (canvas level). Two glyph sets share one origin: A reproduces the cart's value
       (app .w-h3: Sora 700, -.02em; the rupee is Plus Jakarta Sans, as the app renders it) and B the Confirm
       card's amount (app .w-num: Sora 800, -.04em, tabular). Both are set at the landing size, 42 px x 1.512
       = 63.504 px; the flight scales the pair from 17 x 1.62 / 63.504 up to 1. */
    #s08-fly { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; opacity: 0; }
    #s08-fly-y { position: absolute; left: 0; top: 0; width: 1px; height: 1px; }
    #s08-fly-s { position: absolute; left: 0; top: 0; width: 180px; height: 64px; transform-origin: 0 0; }
    #s08-fly-pw { position: absolute; left: -15px; top: -4px; width: 192px; height: 72px; }
    .s08-fly-t { position: absolute; left: 0; top: 0; font-family: var(--font-display); font-size: 63.504px;
      line-height: 1; white-space: nowrap; }
    .s08-fly-t .s08-rs { font-family: var(--font-ui); }
    #s08-fly-a { font-weight: 700; letter-spacing: -.02em; color: #17191E; }
    #s08-fly-b { font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: #F4F5F8; opacity: 0; }
    #s08-fly-plate { position: absolute; inset: 0; box-sizing: border-box; border-radius: 18px;
      background: #1C1E26; border: 1.5px solid rgba(255, 255, 255, .16); box-shadow: 0 14px 30px rgba(3, 6, 20, .34); opacity: 0; }
  </style>
  <div id="root" data-composition-id="s08-cart" data-width="1920" data-height="1080">
    <div class="rig" id="s08-rig">
      <div class="phone" id="s08-phone" data-layout-allow-overflow>
        <div class="side-btn" style="top:190px;height:70px"></div>
        <div class="side-btn" style="top:290px;height:120px"></div>
        <div class="glass"><div class="screen" id="s08-screen"></div></div>
      </div>
    </div>

    <div class="kicker" id="s08-kicker">06 · Cart</div>

    <div class="s08-lab" id="s08-l1">Item total</div>
    <div class="s08-val" id="s08-v1">₹140</div>
    <div class="s08-lab" id="s08-l2">+ Seller delivery charge</div>
    <div class="s08-val" id="s08-v2">₹10</div>
    <div id="s08-rule"></div>
    <div class="s08-lab" id="s08-l3">= Payable to seller</div>
    <div class="s08-val" id="s08-v3">₹150</div>

    <div class="callout callout--dark" id="s08-tag-fee">Set by the stall</div>
    <svg id="s08-leader" viewBox="0 0 1920 1080" aria-hidden="true"><path id="s08-leader-p" d="M1092 497 L1166.2 497" /></svg>

    <div id="s08-slip">
      <div class="dish-chip" id="s08-row1"><span class="s08-plate"></span><span class="veg"></span><span class="s08-qty">1 ×</span><span class="s08-nm">Masala Dosa</span><b>₹80</b></div>
      <div class="dish-chip" id="s08-row2"><span class="s08-plate"></span><span class="veg"></span><span class="s08-qty">2 ×</span><span class="s08-nm">Filter Coffee</span><b>₹60</b></div>
    </div>

    <div id="s08-fly" aria-hidden="true">
      <div id="s08-fly-y"><div id="s08-fly-s">
        <div id="s08-fly-pw"><div id="s08-fly-plate"></div></div>
        <div class="s08-fly-t" id="s08-fly-a" data-layout-allow-overlap><span class="s08-rs">₹</span>150</div>
        <div class="s08-fly-t" id="s08-fly-b" data-layout-allow-overlap><span class="s08-rs">₹</span>150</div>
      </div></div>
    </div>
  </div>
  <script>
    (function () {
      const K = window.SetuKit;
      const spec = { left: 1150, top: 70, k: 1.08 };
      K.placePhone(document.getElementById('s08-phone'), spec);
      const screen = document.getElementById('s08-screen');
      const rig = document.getElementById('s08-rig');
      // Real captures, stacked in order of appearance.
      const stall = K.layer(screen, 'assets/ui/stall/05-coffee-two.png', 's08-stall', { visible: true });
      const cart = K.layer(screen, 'assets/ui/cart/01-cart.png', 's08-cartscr');
      const conf = K.layer(screen, 'assets/ui/checkout/01-confirm-cash.png', 's08-confirm');

      // Boxes in the 390x844 screen: marks.json names, plus rows measured on cart/01-cart.png
      // (those already include ~7 px of air, so their rings use pad 0).
      const M = {
        viewCart: { x: 132.9, y: 798, w: 124.2, h: 38 },   // stall/05-coffee-two.viewCart
        lines: { x: 18, y: 66.3, w: 354, h: 240 },         // cart/01-cart.lines
        itemTotal: { x: 26, y: 462, w: 338, h: 30 },
        fee: { x: 26, y: 518, w: 338, h: 56 },             // label, sub-label and ₹10
        payable: { x: 26, y: 603, w: 338, h: 32 },
        review: { x: 143.8, y: 782, w: 228.2, h: 48 },     // cart/01-cart.review
      };
      // Camera framings {s, P (screen px), T (canvas px)}.
      const F_TOTALS = { s: 1.5, P: [195, 560], T: [1440, 520] };
      const F_CARD = { s: 1.4, P: [195, 142], T: [1420, 300] };

      const tl = gsap.timeline({ paused: true });
      const focusOn = (f, t, dur) => K.focus(tl, rig, K.toCanvas(spec, f.P[0], f.P[1]), f.s, t, dur, { to: { x: f.T[0], y: f.T[1] } });
      // K.ring's look on a measured row box (pad 0, 2 px border), with a short handover exit so only one
      // orange ring is up at a time: the next row's ring arrives as this one leaves (end = mid-fade).
      const rowRing = (box, t, end) => {
        const r = K.el('div', 'ring s08-ring-fine', cart, { left: `${box.x}px`, top: `${box.y}px`,
          width: `${box.w}px`, height: `${box.h}px`, borderRadius: '10px' });
        tl.fromTo(r, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2)' }, t);
        tl.to(r, { opacity: 0, duration: 0.25, ease: 'power1.in' }, end - 0.15);
      };
      // K.tap's ripple fromTo renders its from-state (opacity .95) at build time, which would leave a
      // ghost ring on the button from frame 0. Keep each ripple in a wrapper that shows from its own start.
      const tapAt = (container, box, t) => {
        K.tap(tl, container, box, t);
        const touch = container.lastElementChild;            // K.tap appends the ripple, then the touch dot
        const ripple = touch.previousElementSibling;
        const wrap = K.el('div', 's08-ripwrap', null);
        container.insertBefore(wrap, touch);
        wrap.appendChild(ripple);
        tl.fromTo(wrap, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: 'none' }, t + 0.22);
      };
      // K.swapPush's look and timing, but the incoming capture is parked at x 390 only from t (the kit's
      // fromTo parks it from frame 0, which changes how Chrome rasterizes the visible capture and would
      // make frame 0 differ from a settled stall layer at the s07 cut).
      const push = (from, to, t, dur) => {
        tl.set(to, { opacity: 1, x: 390 }, t);
        tl.to(to, { x: 0, duration: dur, ease: 'expo.inOut' }, t);
        tl.to(from, { x: -110, opacity: 0.35, duration: dur, ease: 'expo.inOut' }, t);
        tl.set(from, { opacity: 0 }, t + dur);
      };
      const rowIn = (lab, val, t) => {
        tl.fromTo(lab, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'expo.out' }, t);
        tl.fromTo(val, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'expo.out' }, t + 0.04);
      };

      // 0.10 chapter kicker.
      K.fadeUp(tl, '#s08-kicker', 0.10);

      // 0.40 next tap target; 0.70 tap 'View cart'; 1.05 the cart pushes in.
      // Ring and tap live in the stall layer, so they leave with it.
      K.ring(tl, stall, M.viewCart, 0.40, 0.65, { blue: true, pad: 5, radius: 24 });
      tapAt(stall, M.viewCart, 0.70);
      push(stall, cart, 1.05, 0.55);

      // 1.10-1.95 the order-slip rows fly ONE AT A TIME, each onto its own cart line (anchor = left-middle,
      // landing on the line's veg mark at screen x 33), then dissolve as they land. The dark plate fades in
      // mid-flight so each row still reads over the white cart.
      const rowFly = (row, dy, t) => {
        tl.fromTo(row, { x: 0, y: 0, scale: 1 }, { x: 1059.6, y: dy, scale: 0.64, duration: 0.4, ease: 'expo.inOut' }, t);
        tl.fromTo(`${row} .s08-plate`, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: 'power1.inOut' }, t + 0.08);
        tl.fromTo(row, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: 'power1.inOut', immediateRender: false }, t + 0.30);
      };
      rowFly('#s08-row1', -139.2, 1.10);   // anchor (140,371) -> (1199.6,231.8) = cart screen (33,136.9), Masala Dosa
      rowFly('#s08-row2', -101.3, 1.45);   // anchor (140,443) -> (1199.6,341.7) = cart screen (33,238.7), Filter Coffee

      // 2.30-3.30 camera onto the totals.
      focusOn(F_TOTALS, 2.30, 1.0);

      // 3.40 item total.
      rowIn('#s08-l1', '#s08-v1', 3.40);
      rowRing(M.itemTotal, 3.40, 4.60);

      // 4.60 the stall's own delivery charge + label in the callout lane.
      rowIn('#s08-l2', '#s08-v2', 4.60);
      rowRing(M.fee, 4.60, 5.80);
      K.callout(tl, '#s08-tag-fee', 4.70, 0.85);
      tl.fromTo('#s08-leader', { opacity: 0 }, { opacity: 1, duration: 0.01, ease: 'none' }, 4.78);   // no 1 px cap before the draw
      K.drawPath(tl, document.getElementById('s08-leader-p'), 4.78, 0.3, { ease: 'power2.out' });
      tl.to('#s08-leader', { opacity: 0, duration: 0.35, ease: 'power1.in' }, 5.55);

      // 5.70 rule; 5.85 the result, rows above dim.
      tl.fromTo('#s08-rule', { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: 'expo.out' }, 5.70);
      rowIn('#s08-l3', '#s08-v3', 5.85);
      tl.to(['#s08-l1', '#s08-v1', '#s08-l2', '#s08-v2'], { opacity: 0.7, duration: 0.35, ease: 'power1.out' }, 5.85);
      rowRing(M.payable, 5.85, 7.15);

      // 7.15 next tap target; 7.30-7.65 math leaves; 7.40 tap 'Review order'; 7.75 Confirm order pushes in.
      K.ring(tl, cart, M.review, 7.15, 0.60, { blue: true, radius: 30 }).classList.add('s08-ring-fine');
      K.fadeOut(tl, ['#s08-l1', '#s08-v1', '#s08-l2', '#s08-v2', '#s08-rule', '#s08-l3', '#s08-v3'], 7.30, { dur: 0.35 });
      tapAt(cart, M.review, 7.40);
      push(cart, conf, 7.75, 0.55);

      // 7.75-8.65 camera onto the amount card (handoffOut framing).
      focusOn(F_CARD, 7.75, 0.9);

      // 7.80-8.65 ₹150 flight. The token appears pixel-matched on the cart's payable value (glyph origin
      // FLY_A under Ftotals, ink colour), a dark chip pops in behind it and the glyphs turn light; it lifts
      // (y leg ends first) and glides onto the Confirm card's amount (origin FLY_B under Fcard), landing at
      // 8.65 with the camera; the chip melts into the dark card; 8.65-8.85 it dissolves into the real UI.
      const FLY_A = { x: 1635.3, y: 600.7, s: (17 * 1.62) / 63.504 };
      const FLY_B = { x: 1174.8, y: 243.9 };
      tl.fromTo('#s08-fly', { opacity: 0 }, { opacity: 1, duration: 0.01, ease: 'none' }, 7.80);
      tl.fromTo('#s08-fly-y', { y: FLY_A.y }, { y: FLY_B.y, duration: 0.70, ease: 'expo.inOut' }, 7.80);
      tl.fromTo('#s08-fly-s', { x: FLY_A.x, scale: FLY_A.s }, { x: FLY_B.x, scale: 1, duration: 0.85, ease: 'expo.inOut' }, 7.80);
      tl.fromTo('#s08-fly-plate', { opacity: 0 }, { opacity: 1, duration: 0.06, ease: 'power1.out' }, 7.80);
      tl.fromTo('#s08-fly-pw', { scale: 0.86 }, { scale: 1, duration: 0.26, ease: 'back.out(1.8)' }, 7.80);
      tl.fromTo('#s08-fly-a', { color: '#17191E' }, { color: '#F4F5F8', duration: 0.05, ease: 'power1.inOut' }, 7.81);
      tl.to('#s08-fly-a', { opacity: 0, duration: 0.2, ease: 'power1.inOut' }, 8.02);
      tl.fromTo('#s08-fly-b', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power1.inOut' }, 8.02);
      tl.to('#s08-fly-plate', { opacity: 0, duration: 0.14, ease: 'power1.inOut' }, 8.52);
      tl.to('#s08-fly', { opacity: 0, duration: 0.2, ease: 'power1.inOut' }, 8.65);

      // 8.80-9.15 kicker out; 8.85-9.30 hold at Fcard.
      K.fadeOut(tl, '#s08-kicker', 8.80, { dur: 0.35 });

      window.__timelines['s08-cart'] = tl;
    }());
  </script>
</template>
</body>
</html>
